[package]
name = "arktos-server"
version = "0.1.0"
edition = "2021"
description = "Arktos rendezvous relay — stateless pairing matchmaker over Tor"

[[bin]]
name = "arktos-server"
path = "src/main.rs"

[dependencies]
arti-client = { version = "=0.47.0", default-features = false,
    features = ["tokio", "rustls", "static-sqlite", "keymgr",
                "onion-service-client", "onion-service-service",
                "experimental-api"] }
tor-hsservice = { version = "=0.47.0", features = ["experimental-api"] }
tor-cell = "=0.47.0"
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
safelog = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[profile.release]
lto = true
opt-level = 2
