name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked || cargo build --release
      - name: package
        run: |
          tar -czf arktos-server-x86_64.tar.gz -C target/release arktos-server
          shasum -a 256 arktos-server-x86_64.tar.gz > arktos-server-x86_64.tar.gz.sha256
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            arktos-server-x86_64.tar.gz arktos-server-x86_64.tar.gz.sha256 \
            --title "arktos-server $GITHUB_REF_NAME" \
            --notes "Rendezvous relay: Arti onion service + OFFER/CLAIM splice + admin UI on 127.0.0.1:8080."
